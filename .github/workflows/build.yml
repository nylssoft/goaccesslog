name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o goaccesslog .

      - name: Test
        run: go test ./...

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: goaccesslog-linux-amd64
          path: goaccesslog
          if-no-files-found: error
